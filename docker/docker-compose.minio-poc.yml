# MinIO local POC overlay — LOCAL/TEST ONLY. Not for production.
#
# MINIO_IMAGE_POLICY=POC_ONLY
# Images use `latest` temporarily to reproduce validated local runs.
# Before any production adoption, pin a verified immutable MinIO version/digest.
# `latest` is NOT production-safe.
#
# Usage:
#   cp docker/.env.minio-poc.example docker/.env.minio-poc
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.minio-poc.yml --env-file docker/.env.minio-poc up -d minio minio-init
#
# Teardown:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.minio-poc.yml down -v

services:
  minio:
    image: minio/minio:latest
    container_name: argos-minio-poc
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in docker/.env.minio-poc}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in docker/.env.minio-poc}
    ports:
      # API — localhost only (POC)
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      # Console — localhost only (POC admin UI)
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_poc_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - default

  minio-init:
    image: minio/mc:latest
    container_name: argos-minio-poc-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$${MINIO_BUCKET:-argos-evidence-poc} &&
      mc anonymous set none local/$${MINIO_BUCKET:-argos-evidence-poc} &&
      echo 'MinIO POC bucket ready (private, no anonymous access)'
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-argos-evidence-poc}
    networks:
      - default
    restart: "no"

volumes:
  minio_poc_data:
    name: argos_minio_poc_data
