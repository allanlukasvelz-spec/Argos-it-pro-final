name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install dependencies (root + apps)
        run: |
          npm ci
          npm ci --prefix frontend
          npm ci --prefix backend

      - name: Verify (lint + frontend build + backend syntax)
        run: npm run verify

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: E2E tests
        run: CI=1 npm run test:e2e

      - name: Production build (explicit gate)
        run: npm run build
