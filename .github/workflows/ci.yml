name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: argos_it
        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Credenciales solo de CI (no son secretos de staging/producción)
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/argos_it
      JWT_SECRET: test_secret_123456789012345678901234567890
      JWT_REFRESH_SECRET: refresh_secret_123456789012345678901234
      PORT: 4000
      NODE_ENV: test
      FRONTEND_URL: http://127.0.0.1:3000
      CORS_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:4000
      ENABLE_SOCKET_IO: "false"
      CI: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Verify (lint, build, node --check)
        run: npm run verify

      - name: Apply database schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/schema.sql

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: CI=1 npm run test:e2e
