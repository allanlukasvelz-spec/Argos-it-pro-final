name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: argos_it
        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/argos_it
      JWT_SECRET: test_secret_123456789012345678901234567890
      JWT_REFRESH_SECRET: refresh_secret_123456789012345678901234
      PORT: 4000
      NODE_ENV: test
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install
      - run: npm --prefix backend install
      - run: npm --prefix frontend install

      - run: npm run verify

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

